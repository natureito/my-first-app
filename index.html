<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>中間地点アプリ</title>
  <style>
    #map {
      width: 100%;
      height: 400px;
      margin-top: 20px;
      display: none;
    }
    #restaurants {
      margin-top: 20px;
    }
    .restaurant {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
    }
    .restaurant a {
      text-decoration: none;
      color: #333;
    }
    .restaurant:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
<h1>駅の中間地点アプリ（複数人対応）</h1>
<div id="inputs"></div>
<button onclick="addInput()">＋ 人を追加</button>
<button onclick="calc()">中間地点を計算</button>
<p id="result"></p>
<div id="map"></div>
<div id="restaurants"></div>
<script>
function addInput() {
  const div = document.createElement("div");
  div.innerHTML = `駅名: <input type="text" class="station">`;
  document.getElementById("inputs").appendChild(div);
}
for (let i = 0; i < 3; i++) {
  addInput();
}

const apiKey = "AIzaSyAsTNH4ojZiwp3lUaGPt8z50eFK8VdeOKE";
const hotpepperKey = "9db61dc2b2324616";

async function getLatLng(name) {
  const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(name)}駅&key=${apiKey}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.results || data.results.length === 0) {
    alert(name + " が見つかりません");
    return null;
  }
  return data.results[0].geometry.location;
}

async function getNearestStations(lat, lng) {
  const url = `https://express.heartrails.com/api/json?method=getStations&x=${lng}&y=${lat}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.response || !data.response.station || data.response.station.length === 0) {
    return [];
  }
  return data.response.station.slice(0, 5);
}

async function getRestaurants(lat, lng, stationName) {
  document.getElementById("restaurants").innerHTML = `<p>${stationName}周辺のレストランを検索中...</p>`;
  
  const callbackName = "hotpepperCallback_" + Date.now();
  const url = `https://webservice.recruit.co.jp/hotpepper/gourmet/v1/?key=${hotpepperKey}&lat=${lat}&lng=${lng}&range=3&count=5&format=jsonp&callback=${callbackName}`;

  window[callbackName] = function(data) {
    const shops = data.results.shop;
    if (!shops || shops.length === 0) {
      document.getElementById("restaurants").innerHTML = `<p>レストランが見つかりませんでした。</p>`;
      return;
    }
    let html = `<h3>${stationName}駅周辺のおすすめレストラン</h3>`;
    shops.forEach(shop => {
      html += `
        <div class="restaurant">
          <a href="${shop.urls.pc}" target="_blank">
            <b>${shop.name}</b><br>
            ${shop.genre.name}　${shop.budget.name}<br>
            ${shop.catch}
          </a>
        </div>`;
    });
    document.getElementById("restaurants").innerHTML = html;
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.src = url;
  script.onerror = () => {
    document.getElementById("restaurants").innerHTML = `<p>レストランの取得に失敗しました。</p>`;
  };
  document.body.appendChild(script);
}

let map = null;
let markers = [];

async function showMap(lat, lng, inputPositions, nearestStations) {
  const mapDiv = document.getElementById("map");
  mapDiv.style.display = "block";
  markers.forEach(m => m.setMap(null));
  markers = [];

  if (!map) {
    map = new google.maps.Map(mapDiv, {
      center: { lat, lng },
      zoom: 13,
    });
  } else {
    map.setCenter({ lat, lng });
  }

  const bounds = new google.maps.LatLngBounds();

  // 入力駅：青
  inputPositions.forEach(pos => {
    markers.push(new google.maps.Marker({
      position: pos,
      map,
      icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
    }));
    bounds.extend(pos);
  });

  // 中間地点：赤
  markers.push(new google.maps.Marker({
    position: { lat, lng },
    map,
    title: "中間地点",
    icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
  }));
  bounds.extend({ lat, lng });

  // 最寄り駅：黄（クリックでレストラン表示）
  for (const s of nearestStations) {
    const coords = await getLatLng(s.name);
    if (coords) {
      const marker = new google.maps.Marker({
        position: coords,
        map,
        title: s.name + "駅",
        icon: "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
      });
      marker.addListener("click", () => {
        getRestaurants(coords.lat, coords.lng, s.name);
      });
      markers.push(marker);
      bounds.extend(coords);
    }
  }

  map.fitBounds(bounds);
}

async function calc() {
  const inputs = document.querySelectorAll(".station");
  let sumLat = 0, sumLng = 0, count = 0;
  const inputPositions = [];

  for (let i = 0; i < inputs.length; i++) {
    if (!inputs[i].value) continue;
    const coords = await getLatLng(inputs[i].value);
    if (coords) {
      sumLat += coords.lat;
      sumLng += coords.lng;
      count++;
      inputPositions.push(coords);
    }
  }
  if (count === 0) return;

  const avgLat = sumLat / count;
  const avgLng = sumLng / count;

  const nearestStations = await getNearestStations(avgLat, avgLng);
  document.getElementById("result").innerHTML =
    `<b>中間地点の最寄り駅（最大5駅）：</b><br>` +
    nearestStations.map((s, i) => `${i + 1}. <a href="#" onclick="getRestaurants(${s.y},${s.x},'${s.name}'); return false;">${s.name}駅（${s.line}）</a>`).join("<br>");

  await showMap(avgLat, avgLng, inputPositions, nearestStations);
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsTNH4ojZiwp3lUaGPt8z50eFK8VdeOKE"></script>
</body>
</html>
