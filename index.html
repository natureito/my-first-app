<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>中間地点アプリ</title>
  <style>
    #map {
      width: 100%;
      height: 400px;
      margin-top: 20px;
      display: none;
    }
    #restaurants {
      margin-top: 20px;
    }
    .restaurant {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
    }
    .restaurant a {
      text-decoration: none;
      color: #333;
    }
    .restaurant:hover {
      background: #f5f5f5;
    }
    #contacts-section {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
<h1>駅の中間地点アプリ（複数人対応）</h1>

<div id="contacts-section">
  <h2>👥 連絡先管理</h2>
  <div>
    名前: <input type="text" id="contact-name" placeholder="例：田中さん">
    最寄り駅: <input type="text" id="contact-station" placeholder="例：新宿">
    <button onclick="addContact()">追加</button>
  </div>
  <div id="contact-list" style="margin-top:10px;"></div>
</div>

<div id="inputs"></div>
<button onclick="addInput()">＋ 人を追加</button>
<button onclick="calc()">中間地点を計算</button>
<p id="result"></p>
<div id="map"></div>
<div id="restaurants"></div>

<script>
// 連絡先管理
function loadContacts() {
  return JSON.parse(localStorage.getItem("contacts") || "[]");
}

function saveContacts(contacts) {
  localStorage.setItem("contacts", JSON.stringify(contacts));
}

function addContact() {
  const name = document.getElementById("contact-name").value.trim();
  const station = document.getElementById("contact-station").value.trim();
  if (!name || !station) {
    alert("名前と最寄り駅を入力してください");
    return;
  }
  const contacts = loadContacts();
  contacts.push({ name, station });
  saveContacts(contacts);
  document.getElementById("contact-name").value = "";
  document.getElementById("contact-station").value = "";
  renderContactList();
}

function deleteContact(index) {
  const contacts = loadContacts();
  contacts.splice(index, 1);
  saveContacts(contacts);
  renderContactList();
}

function renderContactList() {
  const contacts = loadContacts();
  const div = document.getElementById("contact-list");
  if (contacts.length === 0) {
    div.innerHTML = "<p>登録された連絡先はありません</p>";
    return;
  }
  div.innerHTML = contacts.map((c, i) => `
    <div class="contact-item">
      <span>👤 ${c.name}（${c.station}駅）</span>
      <button onclick="deleteContact(${i})">削除</button>
    </div>
  `).join("");
}

// 起動時に連絡先を表示
renderContactList();

// 駅入力欄
function addInput() {
  const div = document.createElement("div");
  div.innerHTML = `駅名: <input type="text" class="station">`;
  document.getElementById("inputs").appendChild(div);
}
for (let i = 0; i < 3; i++) {
  addInput();
}

const apiKey = "AIzaSyAsTNH4ojZiwp3lUaGPt8z50eFK8VdeOKE";

async function getLatLng(name) {
  const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(name)}駅&key=${apiKey}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.results || data.results.length === 0) {
    alert(name + " が見つかりません");
    return null;
  }
  return data.results[0].geometry.location;
}

async function getNearestStations(lat, lng) {
  const url = `https://express.heartrails.com/api/json?method=getStations&x=${lng}&y=${lat}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.response || !data.response.station || data.response.station.length === 0) {
    return [];
  }
  return data.response.station.slice(0, 5);
}

function showRestaurants(lat, lng, stationName) {
  const url = `https://www.google.com/maps/search/レストラン/@${lat},${lng},16z`;
  document.getElementById("restaurants").innerHTML = `
    <div class="restaurant">
      <a href="${url}" target="_blank">
        🍽️ ${stationName}駅周辺のレストランをGoogle Mapsで見る
      </a>
    </div>`;
}

let map = null;
let markers = [];

async function showMap(lat, lng, inputPositions, nearestStations) {
  const mapDiv = document.getElementById("map");
  mapDiv.style.display = "block";
  markers.forEach(m => m.setMap(null));
  markers = [];

  if (!map) {
    map = new google.maps.Map(mapDiv, {
      center: { lat, lng },
      zoom: 13,
    });
  } else {
    map.setCenter({ lat, lng });
  }

  const bounds = new google.maps.LatLngBounds();

  inputPositions.forEach(pos => {
    markers.push(new google.maps.Marker({
      position: pos,
      map,
      icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
    }));
    bounds.extend(pos);
  });

  markers.push(new google.maps.Marker({
    position: { lat, lng },
    map,
    title: "中間地点",
    icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
  }));
  bounds.extend({ lat, lng });

  for (const s of nearestStations) {
    const coords = await getLatLng(s.name);
    if (coords) {
      const marker = new google.maps.Marker({
        position: coords,
        map,
        title: s.name + "駅",
        icon: "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
      });
      marker.addListener("click", () => {
        showRestaurants(coords.lat, coords.lng, s.name);
      });
      markers.push(marker);
      bounds.extend(coords);
    }
  }

  map.fitBounds(bounds);
}

async function calc() {
  const inputs = document.querySelectorAll(".station");
  let sumLat = 0, sumLng = 0, count = 0;
  const inputPositions = [];

  for (let i = 0; i < inputs.length; i++) {
    if (!inputs[i].value) continue;
    const coords = await getLatLng(inputs[i].value);
    if (coords) {
      sumLat += coords.lat;
      sumLng += coords.lng;
      count++;
      inputPositions.push(coords);
    }
  }
  if (count === 0) return;

  const avgLat = sumLat / count;
  const avgLng = sumLng / count;

  const nearestStations = await getNearestStations(avgLat, avgLng);
  document.getElementById("result").innerHTML =
    `<b>中間地点の最寄り駅（最大5駅）：</b><br>` +
    nearestStations.map((s, i) => `${i + 1}. <a href="#" onclick="showRestaurants(${s.y},${s.x},'${s.name}'); return false;">${s.name}駅（${s.line}）</a>`).join("<br>");

  await showMap(avgLat, avgLng, inputPositions, nearestStations);
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsTNH4ojZiwp3lUaGPt8z50eFK8VdeOKE"></script>
</body>
</html>
