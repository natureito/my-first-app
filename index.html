<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中間地点アプリ</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #333;
      --subtext: #666;
      --border: #ddd;
      --primary: #4a90e2;
      --primary-dark: #357abd;
      --tag-bg: #e0f0ff;
      --section-bg: #f0f7ff;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    body.dark {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #eee;
      --subtext: #aaa;
      --border: #444;
      --primary: #4a90e2;
      --primary-dark: #357abd;
      --tag-bg: #1a3a5c;
      --section-bg: #0f2d4a;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      transition: background 0.3s, color 0.3s;
    }
    h1 { font-size: 20px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    h3 { font-size: 15px; margin: 12px 0 8px; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    input[type="text"], select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button.secondary {
      background: var(--border);
      color: var(--text);
    }
    button.secondary:hover { background: #bbb; }
    button.danger {
      background: #e74c3c;
    }
    button.danger:hover { background: #c0392b; }
    button.small {
      padding: 4px 10px;
      font-size: 12px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .dark-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0;
      flex-wrap: wrap;
    }
    .contact-item input { width: 90px; }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--primary);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12px;
      margin: 2px;
    }
    .tag-filter {
      display: inline-block;
      background: var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      margin: 3px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .tag-filter.active {
      background: var(--primary);
      color: white;
    }

    #map { width: 100%; height: 380px; margin-top: 14px; display: none; border-radius: 12px; overflow: hidden; }

    .last-train-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .last-train-info { flex: 1; }
    .last-train-name { font-weight: bold; font-size: 14px; }
    .last-train-route { color: var(--subtext); font-size: 12px; margin-top: 3px; }
    .last-train-link {
      display: inline-block;
      background: var(--primary);
      color: white;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .genre-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .genre-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    .genre-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    #csv-section {
      margin-top: 10px;
      padding: 8px;
      background: var(--bg);
      border-radius: 8px;
      font-size: 13px;
      color: var(--subtext);
    }

    .result-station {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .result-station:last-child { border-bottom: none; }
    .result-station a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
    }
    .result-station .line-name {
      color: var(--subtext);
      font-size: 12px;
      margin-top: 2px;
    }

    @media (max-width: 480px) {
      .last-train-card { flex-direction: column; align-items: flex-start; gap: 8px; }
      .last-train-link { width: 100%; text-align: center; }
      .genre-buttons { gap: 6px; }
      .genre-btn { padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="header-row">
  <h1>📍 中間地点アプリ</h1>
  <button class="dark-toggle" onclick="toggleDark()">🌙 ダーク</button>
</div>

<div class="card">
  <h2>👥 連絡先管理</h2>
  <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
    <input type="text" id="contact-name" placeholder="名前">
    <input type="text" id="contact-station" placeholder="最寄り駅">
    <input type="text" id="contact-tags" placeholder="タグ（例：仕事,友人）">
    <button onclick="addContact()">追加</button>
  </div>
  <div id="csv-section">
    📂 CSVから取り込み：
    <input type="file" id="csv-file" accept=".csv">
    <button onclick="importCSV()">取り込む</button>
  </div>
  <div id="contact-list" style="margin-top:10px;"></div>
</div>

<div class="card" style="border: 1px solid var(--primary);">
  <h2>🏷️ タグで絞り込んで計算</h2>
  <div id="tag-filters" style="margin-bottom:10px;"></div>
  <button onclick="calcByTag()">このタグの人で中間地点を計算</button>
</div>

<div class="card">
  <h2>🚉 出発駅を入力</h2>
  <div id="inputs"></div>
  <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
    <button class="secondary" onclick="addInput()">＋ 人を追加</button>
    <button onclick="calc()">中間地点を計算</button>
  </div>
</div>

<div id="result-card" style="display:none;" class="card">
  <h2>📌 中間地点の最寄り駅（最大5駅）</h2>
  <div id="result"></div>
</div>

<div id="map"></div>

<div id="last-train-section"></div>

<div id="genre-section" style="display:none;" class="card">
  <h2 id="genre-title">🍽️ 周辺のお店を探す</h2>
  <div class="genre-buttons" id="genre-buttons"></div>
</div>

<script>
let currentParticipants = [];
let currentStationName = "";
let currentStationLat = 0;
let currentStationLng = 0;

function toggleDark() {
  document.body.classList.toggle("dark");
  const btn = document.querySelector(".dark-toggle");
  btn.textContent = document.body.classList.contains("dark") ? "☀️ ライト" : "🌙 ダーク";
  localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "1" : "0");
}

if (localStorage.getItem("darkMode") === "1") {
  document.body.classList.add("dark");
  document.querySelector(".dark-toggle").textContent = "☀️ ライト";
}

function loadContacts() {
  return JSON.parse(localStorage.getItem("contacts") || "[]");
}
function saveContacts(contacts) {
  localStorage.setItem("contacts", JSON.stringify(contacts));
}

function importCSV() {
  const file = document.getElementById("csv-file").files[0];
  if (!file) { alert("CSVファイルを選択してください"); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split("\n").map(l => l.trim()).filter(Boolean);
    const contacts = loadContacts();
    let added = 0;
    for (const line of lines) {
      if (line.startsWith("名前") || line.startsWith("name")) continue;
      const cols = line.split(",").map(c => c.trim());
      if (cols.length < 2) continue;
      const name = cols[0], station = cols[1];
      const tags = cols.slice(2).filter(Boolean);
      if (name && station) { contacts.push({ name, station, tags }); added++; }
    }
    saveContacts(contacts);
    renderContactList(); renderTagFilters(); updateAllDropdowns();
    document.getElementById("csv-file").value = "";
    alert(`${added}件取り込みました`);
  };
  reader.readAsText(file, "UTF-8");
}

function getAllTags() {
  const contacts = loadContacts();
  const tagSet = new Set();
  contacts.forEach(c => (c.tags || []).forEach(t => tagSet.add(t)));
  return [...tagSet];
}

let activeTag = null;

function renderTagFilters() {
  const tags = getAllTags();
  const div = document.getElementById("tag-filters");
  if (tags.length === 0) { div.innerHTML = "<p style='color:var(--subtext);font-size:13px;'>タグがまだありません</p>"; return; }
  div.innerHTML = tags.map(t => `
    <span class="tag-filter ${activeTag === t ? 'active' : ''}" onclick="selectTag('${t}')">${t}</span>
  `).join("");
}

function selectTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  renderTagFilters();
}

async function calcByTag() {
  if (!activeTag) { alert("タグを選択してください"); return; }
  const contacts = loadContacts();
  const filtered = contacts.filter(c => (c.tags || []).includes(activeTag));
  if (filtered.length === 0) { alert("該当する連絡先がありません"); return; }
  document.getElementById("inputs").innerHTML = "";
  for (const c of filtered) {
    const div = document.createElement("div");
    div.className = "input-row";
    div.innerHTML = `
      <select class="contact-select" onchange="onSelectContact(this)">${buildOptions()}</select>
      <input type="text" class="station" value="${c.station}" placeholder="駅名">
      <span class="participant-name" style="display:none;">${c.name}</span>
      <button class="secondary small" onclick="this.parentElement.remove()">×</button>
    `;
    document.getElementById("inputs").appendChild(div);
  }
  await calc();
}

function addContact() {
  const name = document.getElementById("contact-name").value.trim();
  const station = document.getElementById("contact-station").value.trim();
  const tagsRaw = document.getElementById("contact-tags").value.trim();
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];
  if (!name || !station) { alert("名前と最寄り駅を入力してください"); return; }
  const contacts = loadContacts();
  contacts.push({ name, station, tags });
  saveContacts(contacts);
  document.getElementById("contact-name").value = "";
  document.getElementById("contact-station").value = "";
  document.getElementById("contact-tags").value = "";
  renderContactList(); renderTagFilters(); updateAllDropdowns();
}

function deleteContact(index) {
  if (!confirm("削除しますか？")) return;
  const contacts = loadContacts();
  contacts.splice(index, 1);
  saveContacts(contacts);
  renderContactList(); renderTagFilters(); updateAllDropdowns();
}

function moveContact(index, direction) {
  const contacts = loadContacts();
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= contacts.length) return;
  [contacts[index], contacts[newIndex]] = [contacts[newIndex], contacts[index]];
  saveContacts(contacts);
  renderContactList(); updateAllDropdowns();
}

function startEdit(index) { renderContactList(index); }

function saveEdit(index) {
  const name = document.getElementById(`edit-name-${index}`).value.trim();
  const station = document.getElementById(`edit-station-${index}`).value.trim();
  const tagsRaw = document.getElementById(`edit-tags-${index}`).value.trim();
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];
  if (!name || !station) { alert("名前と最寄り駅を入力してください"); return; }
  const contacts = loadContacts();
  contacts[index] = { name, station, tags };
  saveContacts(contacts);
  renderContactList(); renderTagFilters(); updateAllDropdowns();
}

function renderContactList(editIndex = -1) {
  const contacts = loadContacts();
  const div = document.getElementById("contact-list");
  if (contacts.length === 0) { div.innerHTML = "<p style='color:var(--subtext);font-size:13px;'>登録された連絡先はありません</p>"; return; }
  div.innerHTML = contacts.map((c, i) => {
    const tagsHtml = (c.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
    if (i === editIndex) {
      return `
        <div class="contact-item">
          <input id="edit-name-${i}" type="text" value="${c.name}">
          <input id="edit-station-${i}" type="text" value="${c.station}">
          タグ: <input id="edit-tags-${i}" type="text" value="${(c.tags || []).join(",")}">
          <button class="small" onclick="saveEdit(${i})">保存</button>
          <button class="secondary small" onclick="renderContactList()">キャンセル</button>
        </div>`;
    }
    return `
      <div class="contact-item">
        <span>👤 ${c.name}（${c.station}駅）${tagsHtml}</span>
        <button class="secondary small" onclick="startEdit(${i})">編集</button>
        <button class="danger small" onclick="deleteContact(${i})">削除</button>
        <button class="secondary small" onclick="moveContact(${i}, -1)" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="secondary small" onclick="moveContact(${i}, 1)" ${i === contacts.length - 1 ? "disabled" : ""}>↓</button>
      </div>`;
  }).join("");
}

function buildOptions() {
  const contacts = loadContacts();
  let options = `<option value="">-- 人を選ぶ --</option>`;
  contacts.forEach(c => {
    options += `<option value="${c.station}" data-name="${c.name}">${c.name}（${c.station}駅）</option>`;
  });
  return options;
}

function updateAllDropdowns() {
  document.querySelectorAll(".contact-select").forEach(sel => {
    const current = sel.value;
    sel.innerHTML = buildOptions();
    sel.value = current;
  });
}

function onSelectContact(sel) {
  const row = sel.parentElement;
  const stationInput = row.querySelector(".station");
  const nameSpan = row.querySelector(".participant-name");
  if (sel.value) {
    stationInput.value = sel.value;
    if (nameSpan) nameSpan.textContent = sel.options[sel.selectedIndex].dataset.name || "";
  }
}

function addInput() {
  const div = document.createElement("div");
  div.className = "input-row";
  div.innerHTML = `
    <select class="contact-select" onchange="onSelectContact(this)">${buildOptions()}</select>
    <input type="text" class="station" placeholder="または直接入力">
    <span class="participant-name" style="display:none;"></span>
    <button class="secondary small" onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById("inputs").appendChild(div);
}

function showGenreButtons(lat, lng, stationName) {
  currentStationName = stationName;
  currentStationLat = lat;
  currentStationLng = lng;

  const genres = [
    { label: "🍺 居酒屋", query: "居酒屋" },
    { label: "☕ カフェ", query: "カフェ" },
    { label: "🍴 ファミレス", query: "ファミレス" },
    { label: "🍜 ランチ", query: "ランチ" },
    { label: "🍣 寿司", query: "寿司" },
    { label: "🍖 焼肉", query: "焼肉" },
    { label: "🍕 イタリアン", query: "イタリアン" },
    { label: "🍷 ワインバー", query: "ワインバー" },
  ];

  const section = document.getElementById("genre-section");
  document.getElementById("genre-title").textContent = `🍽️ ${stationName}駅周辺のお店を探す`;
  document.getElementById("genre-buttons").innerHTML = genres.map(g => {
    const url = `https://www.google.com/maps/search/${encodeURIComponent(g.query)}/@${lat},${lng},16z`;
    return `<a class="genre-btn" href="${url}" target="_blank">${g.label}</a>`;
  }).join("");
  section.style.display = "block";
}

function showLastTrains(stationName) {
  if (currentParticipants.length === 0) return;
  const section = document.getElementById("last-train-section");
  let html = `<div class="card"><h2>🚃 終電情報（${stationName}駅 発）</h2>`;
  currentParticipants.forEach(p => {
    if (p.station === stationName) return;
    const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(stationName + "駅")}&destination=${encodeURIComponent(p.station + "駅")}&travelmode=transit`;
    html += `
      <div class="last-train-card">
        <div class="last-train-info">
          <div class="last-train-name">👤 ${p.name}</div>
          <div class="last-train-route">🏠 ${p.station}駅まで</div>
        </div>
        <a class="last-train-link" href="${url}" target="_blank">終電を調べる →</a>
      </div>`;
  });
  html += `</div>`;
  section.innerHTML = html;
}

function onStationClick(lat, lng, stationName) {
  showGenreButtons(lat, lng, stationName);
  showLastTrains(stationName);
}

renderContactList();
renderTagFilters();
for (let i = 0; i < 3; i++) addInput();

const apiKey = "AIzaSyAsTNH4ojZiwp3lUaGPt8z50eFK8VdeOKE";

async function getLatLng(name) {
  const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(name)}駅&key=${apiKey}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.results || data.results.length === 0) { alert(name + " が見つかりません"); return null; }
  return data.results[0].geometry.location;
}

async function getNearestStations(lat, lng) {
  const url = `https://express.heartrails.com/api/json?method=getStations&x=${lng}&y=${lat}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.response || !data.response.station || data.response.station.length === 0) return [];
  return data.response.station.slice(0, 5);
}

let map = null;
let markers = [];

async function showMap(lat, lng, inputPositions, nearestStations) {
  const mapDiv = document.getElementById("map");
  mapDiv.style.display = "block";
  markers.forEach(m => m.setMap(null));
  markers = [];

  if (!map) {
    map = new google.maps.Map(mapDiv, { center: { lat, lng }, zoom: 13 });
  } else {
    map.setCenter({ lat, lng });
  }

  const bounds = new google.maps.LatLngBounds();

  inputPositions.forEach(pos => {
    markers.push(new google.maps.Marker({
      position: pos, map,
      icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
    }));
    bounds.extend(pos);
  });

  markers.push(new google.maps.Marker({
    position: { lat, lng }, map, title: "中間地点",
    icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
  }));
  bounds.extend({ lat, lng });

  for (const s of nearestStations) {
    const coords = await getLatLng(s.name);
    if (coords) {
      const marker = new google.maps.Marker({
        position: coords, map, title: s.name + "駅",
        icon: "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
      });
      marker.addListener("click", () => onStationClick(coords.lat, coords.lng, s.name));
      markers.push(marker);
      bounds.extend(coords);
    }
  }
  map.fitBounds(bounds);
}

async function calc() {
  const rows = document.querySelectorAll(".input-row");
  let sumLat = 0, sumLng = 0, count = 0;
  const inputPositions = [];
  currentParticipants = [];

  for (const row of rows) {
    const stationInput = row.querySelector(".station");
    const nameSpan = row.querySelector(".participant-name");
    const select = row.querySelector(".contact-select");
    if (!stationInput || !stationInput.value) continue;
    const stationName = stationInput.value;
    let participantName = nameSpan?.textContent?.trim() || "";
    if (!participantName && select && select.selectedIndex > 0) {
      participantName = select.options[select.selectedIndex].dataset.name || stationName;
    }
    if (!participantName) participantName = stationName + "駅";
    const coords = await getLatLng(stationName);
    if (coords) {
      sumLat += coords.lat;
      sumLng += coords.lng;
      count++;
      inputPositions.push(coords);
      currentParticipants.push({ name: participantName, station: stationName });
    }
  }
  if (count === 0) return;

  const avgLat = sumLat / count;
  const avgLng = sumLng / count;

  const nearestStations = await getNearestStations(avgLat, avgLng);

  const resultCard = document.getElementById("result-card");
  resultCard.style.display = "block";
  document.getElementById("result").innerHTML = nearestStations.map((s, i) => `
    <div class="result-station">
      <a href="#" onclick="onStationClick(0,0,'${s.name}'); return false;">
        ${i + 1}. ${s.name}駅
      </a>
      <div class="line-name">${s.line}</div>
    </div>
  `).join("");

  document.getElementById("last-train-section").innerHTML = "";
  document.getElementById("genre-section").style.display = "none";
  await showMap(avgLat, avgLng, inputPositions, nearestStations);
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsTNH4ojZiwp3lUaGPt8z50eFK8VdeOKE"></script>
</body>
</html>
